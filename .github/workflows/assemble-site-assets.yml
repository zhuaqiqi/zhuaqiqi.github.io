jobs:
  upload:
    if: ${{ github.run_number == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify and upload portfolio assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, time, urllib.request, urllib.error, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'zhuaqiqi/zhuaqiqi.github.io'
          root = 'https://api.github.com/repos/' + repo + '/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(url, value=None, method=None):
              data = None if value is None else json.dumps(value).encode()
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers, method=method or ('GET' if data is None else 'POST'))
                      with urllib.request.urlopen(req, timeout=180) as response:
                          return {} if response.status == 204 else json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (403, 429, 500, 502, 503, 504) or attempt == 3:
                          raise
                      time.sleep(max(60, int(error.headers.get('Retry-After', '60'))))
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def upload(data, expected):
              assert blob_sha(data) == expected
              result = request(root, {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              assert result['sha'] == expected
          config = json.loads(os.environ['SITE_UPLOAD_CONFIG'])
          if not config['parts']:
              upload(b'', 'e69de29bb2d1d6434b8b29ae775ad8c2e48c5391')
              print('Upload connection ready')
          else:
              archive_data = bytearray()
              for expected in config['parts']:
                  record = request(root + '/' + expected)
                  part = base64.b64decode(record['content'])
                  assert blob_sha(part) == expected
                  archive_data.extend(part)
              with zipfile.ZipFile(io.BytesIO(archive_data)) as archive:
                  assert sorted(archive.namelist()) == sorted(item['path'] for item in config['files'])
                  for item in config['files']:
                      path = item['path']
                      assert '..' not in path.split('/') and not path.startswith('/')
                      assert not path.lower().endswith(('.pdf', '.doc', '.docx', '.zip'))
                      payload = archive.read(path)
                      upload(payload, item['sha'])
                      print('Uploaded:', path, item['sha'], flush=True)
                      time.sleep(1.1)
              print('All requested portfolio assets uploaded and verified')
              cache_branch = os.environ['SITE_CACHE_BRANCH']
              assert cache_branch.startswith('site-assets-cache-20261027-') and '/' not in cache_branch
              api_root = 'https://api.github.com/repos/' + repo
              try:
                  reference = request(api_root + '/git/ref/heads/' + cache_branch)
                  assert reference['object']['sha'] == os.environ['SITE_CACHE_SHA']
                  request(api_root + '/git/refs/heads/' + cache_branch, method='DELETE')
                  print('Temporary asset cache removed')
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
          PY

